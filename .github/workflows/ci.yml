name: CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:test_password@localhost:5432/agent_relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: agent-relay
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Load image into kind
        run: |
          kind load docker-image \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            --name agent-relay

      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/agent-relay \
            agent-relay=${IMAGE_NAME}:${IMAGE_TAG}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/agent-relay \
            --timeout=120s
