name: CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:test_password@localhost:5432/agent_relay

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE_NAME: agent-relay
      IMAGE_TAG: ${{ github.sha }}
      KIND_CLUSTER_NAME: kind

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Install kind and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client

      - name: Create kind cluster (if not exists)
        run: |
          if kind get clusters | grep -q "^${KIND_CLUSTER_NAME}$"; then
            if [ "$(docker inspect -f '{{.State.Running}}' ${KIND_CLUSTER_NAME}-control-plane 2>/dev/null)" = "true" ]; then
              echo "Cluster '${KIND_CLUSTER_NAME}' sudah ada dan running, skip pembuatan."
            else
              echo "Cluster '${KIND_CLUSTER_NAME}' terdaftar tapi container tidak running, hapus lalu buat ulang..."
              kind delete cluster --name ${KIND_CLUSTER_NAME}
              kind create cluster --name ${KIND_CLUSTER_NAME}
            fi
          else
            kind create cluster --name ${KIND_CLUSTER_NAME}
          fi

      - name: Export kubeconfig
        run: |
          kind export kubeconfig --name ${KIND_CLUSTER_NAME}

      - name: Load image into kind
        run: |
          kind load docker-image \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            --name ${KIND_CLUSTER_NAME}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/agent-relay \
            agent-relay=${IMAGE_NAME}:${IMAGE_TAG}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/agent-relay \
            --timeout=120s

      - name: Test dashboard
        run: |
          kubectl port-forward \
            service/agent-relay \
            18000:8000 > /tmp/port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill $PF_PID' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/ > /tmp/dashboard.html; then
              break
            fi
            sleep 2
          done

          grep -q "Agent Relay v2" /tmp/dashboard.html

          echo "Dashboard test passed"